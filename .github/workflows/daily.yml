name: WNBA Model — Daily Run

on:
  schedule:
    - cron: '15 16 * * *'   # 12:15 PM ET daily
    - cron: '15 19 * * *'   # 3:15 PM ET odds refresh
    - cron: '15 12 * * 0'   # Sunday 8:15 AM ET retrain
  workflow_dispatch:

jobs:

  # ── SUNDAY RETRAIN ──
  retrain:
    name: Weekly retrain
    runs-on: ubuntu-latest
    if: github.event.schedule == '15 12 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retrain
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:    ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:   ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
        run: python cell5_retrain.py

      - name: Cache models
        uses: actions/upload-artifact@v4
        with:
          name: wnba-models
          path: scripts/models/
          retention-days: 8


  # ── DAILY SIGNALS ──
  daily_signals:
    name: Daily projections + signals
    runs-on: ubuntu-latest
    if: github.event.schedule == '15 16 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest models
        uses: actions/download-artifact@v4
        with:
          name: wnba-models
          path: scripts/models/
        continue-on-error: true

      - name: Retrain if no models cached
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:    ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:   ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ ! -f models/game_models.pkl ]; then
            echo "No cached models — running retrain first"
            python cell5_retrain.py
          fi

      - name: Run projections
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:    ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:   ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
        run: python cell6_projections.py

      - name: Run game signals
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:    ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:   ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
        run: python cell7_signals.py

      - name: Run prop signals
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:    ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:   ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
        run: python cell8_props.py


  # ── ODDS REFRESH 3PM ET ──
  odds_refresh:
    name: Odds refresh
    runs-on: ubuntu-latest
    if: github.event.schedule == '15 19 * * *'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest models
        uses: actions/download-artifact@v4
        with:
          name: wnba-models
          path: scripts/models/
        continue-on-error: true

      - name: Re-run all signals with updated lines
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:    ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:   ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
        run: |
          python cell6_projections.py
          python cell7_signals.py
          python cell8_props.py
