name: WNBA Model — Daily Run

on:
  schedule:
    # 12:00 PM ET = 16:00 UTC (EDT) / 17:00 UTC (EST)
    - cron: '0 16 * * *'
    # 3:00 PM ET odds refresh = 19:00 UTC
    - cron: '0 19 * * *'
    # Sunday 8:00 AM ET retrain = 12:00 UTC Sunday
    - cron: '0 12 * * 0'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:

  # ── SUNDAY RETRAIN ──
  retrain:
    name: Weekly retrain
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 12 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retrain
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:   ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:  ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python cell5_retrain.py

      - name: Cache models
        uses: actions/upload-artifact@v4
        with:
          name: wnba-models
          path: scripts/models/
          retention-days: 8


  # ── DAILY SIGNALS (noon ET) ──
  daily_signals:
    name: Daily projections + signals
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest models
        uses: actions/download-artifact@v4
        with:
          name: wnba-models
          path: scripts/models/
        continue-on-error: true  # first run won't have cached models

      - name: Fallback — retrain if no models cached
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:   ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:  ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ ! -f models/game_models.pkl ]; then
            echo "No cached models — running retrain first"
            python cell5_retrain.py
          fi

      - name: Run projections (cell 6)
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:   ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:  ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python cell6_projections.py

      - name: Run game signals (cell 7)
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:   ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:  ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python cell7_signals.py

      - name: Run prop signals (cell 8)
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:   ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:  ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python cell8_props.py


  # ── AFTERNOON ODDS REFRESH (3pm ET) ──
  odds_refresh:
    name: Odds refresh
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 19 * * *'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest models
        uses: actions/download-artifact@v4
        with:
          name: wnba-models
          path: scripts/models/
        continue-on-error: true

      - name: Re-run signals with updated lines
        working-directory: scripts
        env:
          BALLDONTLIE_KEY:   ${{ secrets.BALLDONTLIE_KEY }}
          GOOGLE_SHEETS_ID:  ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python cell6_projections.py
          python cell7_signals.py
          python cell8_props.py
